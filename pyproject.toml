[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-meeting-review"
version = "0.1.0"
description = "Контроль качества встреч отдела продаж на LLM: транскрибация, обезличивание, разбор по чек-листу с цитатами, учёт стоимости"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Никита Каганович" }]
dependencies = [
    "anthropic>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
meeting-review = "meeting_review.cli:main"

[tool.setuptools.packages.find]
include = ["meeting_review*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
